name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\AvaloniaAppMPV.csproj

      - name: Build
        run: dotnet build .\AvaloniaAppMPV.csproj -c Release --no-restore

  package-windows:
    name: Package win-x64
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore win-x64
        run: dotnet restore .\AvaloniaAppMPV.csproj -r win-x64

      - name: Download libmpv
        shell: pwsh
        run: .\scripts\Download-Mpv.ps1

      - name: Publish win-x64
        run: dotnet publish .\AvaloniaAppMPV.csproj -c Release -r win-x64 --self-contained false --no-restore -o .\publish\win-x64

      - name: Prepare package folder
        shell: pwsh
        run: |
          $packageRoot = ".\publish\package"
          $packageDir = Join-Path $packageRoot "AAMPV"

          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item .\publish\win-x64\* $packageDir -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AvaloniaAppMPV-win-x64
          path: .\publish\package\AAMPV
