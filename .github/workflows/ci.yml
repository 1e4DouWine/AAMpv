name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\AvaloniaAppMPV.csproj

      - name: Download libmpv
        shell: pwsh
        run: .\scripts\Download-Mpv.ps1

      - name: Publish win-x64
        run: dotnet publish .\AvaloniaAppMPV.csproj -c Release -r win-x64 --self-contained false -o .\publish\win-x64

      - name: Zip package
        run: Compress-Archive -Path .\publish\win-x64\* -DestinationPath .\publish\AvaloniaAppMPV-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AvaloniaAppMPV-win-x64
          path: .\publish\AvaloniaAppMPV-win-x64.zip
